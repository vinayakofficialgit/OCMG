[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocmg"
version = "0.2.0"
description = "Outcome-Calibrated Memory Governance for long-term memory in LLM agents (MSc dissertation code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=2.2",
    "transformers>=4.44",
    "torch>=2.1",
    "accelerate>=0.30",
]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["ocmg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
